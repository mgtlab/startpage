<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="robots" content="noindex, nofollow">
    <title>MGT Launchpad </title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .tile:active { transform: scale(0.96); filter: brightness(1.2); }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .hidden { display: none !important; }
    </style>
</head>
<body class="bg-[#0f172a] text-slate-200 min-h-screen p-4 pb-20 font-sans">

    <div class="max-w-md mx-auto">
        <header id="adminHeader" class="flex justify-between items-center mb-6 hidden">
            <h1 class="text-xl font-black italic text-blue-500 uppercase tracking-tighter">Admin.Sync</h1>
            <div class="flex gap-2">
                <button onclick="setupGithub()" class="p-2 bg-slate-800 rounded-lg text-[10px] border border-slate-700">CONFIG</button>
                <button onclick="pushToGithub()" class="p-2 bg-blue-600 rounded-lg text-[10px] font-bold shadow-lg">PUSH DATA</button>
            </div>
        </header>

        <header id="publicHeader" class="mb-6 text-center">
            <h1 class="text-2xl font-bold text-white tracking-tight">MGT Public Launchpad/ONLY AUTHORIZED PERSONNEL.</h1>
        </header>

        <form action="https://www.google.com/search" method="GET" class="relative mb-6">
            <input type="text" name="q" placeholder="Search Google..." class="w-full bg-slate-800/50 border border-slate-700 rounded-2xl py-4 px-6 text-lg focus:border-blue-500 outline-none shadow-inner">
            <button type="submit" class="absolute right-4 top-4 text-blue-400">🔍</button>
        </form>

        <section id="adminInput" class="mb-8 bg-blue-600/5 border border-blue-500/20 p-4 rounded-3xl hidden">
            <input type="hidden" id="editIndex" value="-1">
            <div class="grid grid-cols-2 gap-2 mb-3">
                <input type="text" id="siteName" placeholder="Label" class="bg-slate-900 rounded-xl p-3 text-sm border border-slate-700">
                <input type="url" id="siteUrl" placeholder="URL" class="bg-slate-900 rounded-xl p-3 text-sm border border-slate-700">
            </div>
            <div class="flex gap-2">
                <button id="addBtn" onclick="addLink()" class="flex-1 bg-blue-600 font-bold py-3 rounded-xl uppercase text-xs tracking-widest">+ Save Locally</button>
                <button id="cancelBtn" onclick="resetForm()" class="hidden bg-slate-700 px-4 py-3 rounded-xl text-xs">✕</button>
            </div>
        </section>

        <div class="flex justify-between items-center mb-4 px-1">
            <input type="text" id="filterInput" oninput="render()" placeholder="Filter..." class="bg-transparent border-b border-slate-700 text-xs py-1 outline-none focus:border-blue-500 w-1/2">
            <div class="flex bg-slate-800 rounded-lg p-1 scale-90">
                <button onclick="setView('grid')" id="btnGrid" class="px-3 py-1 rounded-md text-[10px] bg-blue-600">GRID</button>
                <button onclick="setView('list')" id="btnList" class="px-3 py-1 rounded-md text-[10px] ml-1">LIST</button>
            </div>
        </div>

        <div id="linksContainer"></div>
        
        <button onclick="setupGithub()" class="fixed bottom-4 right-4 bg-slate-800/50 p-3 rounded-full border border-slate-700 opacity-20 hover:opacity-100 transition-all">⚙️</button>
    </div>

    <script>
        const DEFAULT_USER = 'mgtlab';
        const DEFAULT_REPO = 'startpage';
        let GITHUB_CONFIG = JSON.parse(localStorage.getItem('gh_config')) || { token: '', user: DEFAULT_USER, repo: DEFAULT_REPO };
        let links = [];
        let currentView = 'grid';

        async function loadData() {
            const isAdmin = !!GITHUB_CONFIG.token;
            const localData = localStorage.getItem('local_links');

            if (isAdmin && localData) {
                links = JSON.parse(localData);
                render();
            } else {
                const url = `https://raw.githubusercontent.com/${GITHUB_CONFIG.user || DEFAULT_USER}/${GITHUB_CONFIG.repo || DEFAULT_REPO}/main/links.json?t=${Date.now()}`;
                try {
                    const res = await fetch(url);
                    if (res.ok) { links = await res.json(); render(); }
                } catch (e) { console.warn("Fetch failed"); }
            }
        }

        function setView(view) {
            currentView = view;
            document.getElementById('btnGrid').classList.toggle('bg-blue-600', view === 'grid');
            document.getElementById('btnList').classList.toggle('bg-blue-600', view === 'list');
            render();
        }

        function render() {
            const container = document.getElementById('linksContainer');
            const isAdmin = !!GITHUB_CONFIG.token;
            const filter = document.getElementById('filterInput').value.toLowerCase();
            const filtered = links.filter(l => l.name.toLowerCase().includes(filter) || l.url.toLowerCase().includes(filter));

            document.getElementById('adminHeader').classList.toggle('hidden', !isAdmin);
            document.getElementById('adminInput').classList.toggle('hidden', !isAdmin);
            document.getElementById('publicHeader').classList.toggle('hidden', isAdmin);

            if (currentView === 'grid') {
                container.className = "grid grid-cols-3 gap-3";
                container.innerHTML = filtered.map((link, idx) => {
                    const originalIdx = links.indexOf(link);
                    return `
                    <div class="relative">
                        <a href="${link.url}" class="tile flex flex-col items-center justify-center bg-slate-800/40 border border-slate-700 aspect-square rounded-2xl p-2">
                            <span class="text-xl font-bold text-blue-400 mb-1">${link.name.substring(0,2).toUpperCase()}</span>
                            <span class="text-[9px] uppercase text-center leading-tight line-clamp-2">${link.name}</span>
                        </a>
                        ${isAdmin ? `
                            <div class="absolute -top-1 -right-1 flex flex-col gap-1">
                                <button onclick="startEdit(${originalIdx})" class="bg-blue-600 text-white rounded-full w-5 h-5 flex items-center justify-center text-[10px] border border-slate-900">✎</button>
                                <button onclick="deleteLink(${originalIdx})" class="bg-red-600 text-white rounded-full w-5 h-5 flex items-center justify-center text-[10px] border border-slate-900">✕</button>
                            </div>
                        ` : ''}
                    </div>`;
                }).join('');
            } else {
                container.className = "flex flex-col gap-2";
                container.innerHTML = filtered.map((link, idx) => {
                    const originalIdx = links.indexOf(link);
                    return `
                    <div class="flex items-center justify-between bg-slate-800/60 p-3 rounded-xl border border-slate-700">
                        <a href="${link.url}" class="flex-1 truncate mr-4">
                            <div class="font-bold text-sm text-blue-400 truncate">${link.name}</div>
                            <div class="text-[10px] opacity-50 truncate">${link.url}</div>
                        </a>
                        ${isAdmin ? `
                            <div class="flex gap-3">
                                <button onclick="startEdit(${originalIdx})" class="text-blue-400 text-xs font-bold uppercase">Edit</button>
                                <button onclick="deleteLink(${originalIdx})" class="text-red-400 text-xs font-bold uppercase">Del</button>
                            </div>
                        ` : ''}
                    </div>`;
                }).join('');
            }
            if(isAdmin) localStorage.setItem('local_links', JSON.stringify(links));
        }

        function addLink() {
            const nameEl = document.getElementById('siteName');
            const urlEl = document.getElementById('siteUrl');
            const editIdx = parseInt(document.getElementById('editIndex').value);
            let url = urlEl.value.trim();
            if (!url) return;
            if (!url.startsWith('http')) url = 'https://' + url;
            const name = nameEl.value.trim() || url.replace(/https?:\/\//,'').split('/')[0];

            if (editIdx > -1) { links[editIdx] = { name, url }; } 
            else { links.unshift({ name, url }); }

            resetForm();
            render();
        }

        function startEdit(idx) {
            const link = links[idx];
            document.getElementById('siteName').value = link.name;
            document.getElementById('siteUrl').value = link.url;
            document.getElementById('editIndex').value = idx;
            document.getElementById('addBtn').innerText = "✓ Update Link";
            document.getElementById('cancelBtn').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetForm() {
            document.getElementById('siteName').value = '';
            document.getElementById('siteUrl').value = '';
            document.getElementById('editIndex').value = "-1";
            document.getElementById('addBtn').innerText = "+ Save Locally";
            document.getElementById('cancelBtn').classList.add('hidden');
        }

        function deleteLink(idx) {
            if(confirm('Delete?')) { links.splice(idx, 1); render(); }
        }

        function setupGithub() {
            const user = prompt("User:", GITHUB_CONFIG.user);
            const repo = prompt("Repo:", GITHUB_CONFIG.repo);
            const token = prompt("Token:", GITHUB_CONFIG.token);
            if(user && repo) {
                GITHUB_CONFIG = { user, repo, token };
                localStorage.setItem('gh_config', JSON.stringify(GITHUB_CONFIG));
                window.location.reload();
            }
        }

        async function pushToGithub() {
            if(!GITHUB_CONFIG.token) return;
            const apiURL = `https://api.github.com/repos/${GITHUB_CONFIG.user}/${GITHUB_CONFIG.repo}/contents/links.json`;
            let sha = "";
            try {
                const getRes = await fetch(apiURL, { headers: { 'Authorization': `token ${GITHUB_CONFIG.token}` } });
                if(getRes.ok) { const d = await getRes.json(); sha = d.sha; }
            } catch(e) {}
            const res = await fetch(apiURL, {
                method: 'PUT',
                headers: { 'Authorization': `token ${GITHUB_CONFIG.token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    message: "Sync",
                    content: btoa(unescape(encodeURIComponent(JSON.stringify(links, null, 2)))),
                    sha: sha || null
                })
            });
            alert(res.ok ? "✅ Synced!" : "❌ Error: " + res.status);
        }

        loadData();
    </script>
</body>
</html>
