<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Launchpad Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .tile:active { transform: scale(0.96); filter: brightness(1.2); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-[#0f172a] text-slate-200 min-h-screen font-sans p-4">

    <div class="max-w-md mx-auto">
        <header class="flex justify-between items-center mb-6">
            <h1 class="text-xl font-black italic text-blue-500">SYSTEM.START</h1>
            <div class="flex gap-2">
                <button onclick="exportData()" class="p-2 bg-slate-800 rounded-lg text-[10px] font-bold">↓ BACKUP</button>
                <button onclick="importData()" class="p-2 bg-slate-800 rounded-lg text-[10px] font-bold">↑ LOAD</button>
            </div>
        </header>

        <form action="https://www.google.com/search" method="GET" class="relative mb-8">
            <input type="text" name="q" placeholder="Search..." class="w-full bg-slate-800/50 border border-slate-700 rounded-2xl py-4 px-6 text-lg">
            <button type="submit" class="absolute right-4 top-4 text-blue-400">🔍</button>
        </form>

        <section class="mb-10 bg-blue-600/10 border border-blue-500/20 p-4 rounded-2xl">
            <input type="hidden" id="editIndex" value="-1">
            <div class="grid grid-cols-2 gap-2 mb-2">
                <input type="text" id="siteName" placeholder="Label" class="bg-slate-900 rounded-xl p-3 text-sm border border-slate-700">
                <input type="url" id="siteUrl" placeholder="URL" class="bg-slate-900 rounded-xl p-3 text-sm border border-slate-700">
            </div>
            <button id="addBtn" onclick="addLink()" class="w-full bg-blue-600 font-bold py-3 rounded-xl shadow-lg active:bg-blue-700">
                + ADD / UPDATE
            </button>
        </section>

        <div id="linksContainer" class="grid grid-cols-3 gap-3"></div>
    </div>

    <script>
        const STORAGE_KEY = 'dev_startpage_v1';
        let links = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

        function render() {
            const container = document.getElementById('linksContainer');
            container.innerHTML = links.map((link, index) => `
                <div class="relative">
                    <a href="${link.url}" class="tile flex flex-col items-center justify-center bg-slate-800/40 border border-slate-700 aspect-square rounded-2xl p-2">
                        <span class="text-xl font-bold text-white mb-1">${link.name.substring(0,2).toUpperCase()}</span>
                        <span class="text-[9px] uppercase text-center leading-tight break-all overflow-hidden">${link.name}</span>
                    </a>
                    <div class="absolute -top-1 -right-1 flex flex-col gap-1">
                        <button onclick="deleteLink(${index})" class="bg-red-900/80 text-white rounded-full w-5 h-5 text-[8px] flex items-center justify-center border border-red-500">✕</button>
                        <button onclick="startEdit(${index})" class="bg-blue-900/80 text-white rounded-full w-5 h-5 text-[8px] flex items-center justify-center border border-blue-500 text-xs">✎</button>
                    </div>
                </div>
            `).join('');
            localStorage.setItem(STORAGE_KEY, JSON.stringify(links));
        }

        function addLink() {
            const nameEl = document.getElementById('siteName');
            const urlEl = document.getElementById('siteUrl');
            const editIdx = parseInt(document.getElementById('editIndex').value);
            
            let url = urlEl.value.trim();
            if (!url) return;
            if (!url.startsWith('http')) url = 'https://' + url;
            
            let name = nameEl.value.trim() || url.replace('https://','').split('.')[0];

            if (editIdx > -1) {
                links[editIdx] = { name, url };
                document.getElementById('editIndex').value = "-1";
                document.getElementById('addBtn').innerText = "+ ADD TO DASHBOARD";
            } else {
                links.push({ name, url });
            }

            nameEl.value = '';
            urlEl.value = '';
            render();
        }

        function startEdit(index) {
            const link = links[index];
            document.getElementById('siteName').value = link.name;
            document.getElementById('siteUrl').value = link.url;
            document.getElementById('editIndex').value = index;
            document.getElementById('addBtn').innerText = "✓ UPDATE LINK";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function deleteLink(index) {
            if(confirm('Delete?')) {
                links.splice(index, 1);
                render();
            }
        }

        // Backup functions remain same
        function exportData() {
            const blob = new Blob([JSON.stringify(links)], {type: 'application/json'});
            const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: 'links.json' });
            a.click();
        }

        function importData() {
            const input = document.createElement('input');
            input.type = 'file';
            input.onchange = e => {
                const reader = new FileReader();
                reader.onload = ev => { links = JSON.parse(ev.target.result); render(); };
                reader.readAsText(e.target.files[0]);
            };
            input.click();
        }

        render();
    </script>
</body>
</html>
